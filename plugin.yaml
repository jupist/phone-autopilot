name: phone-autopilot
version: 0.1.0
manifest_version: 2
description: Teach your phone a task once, replay it without the model, heal it when an app changes, and schedule it daily. Builds on phone-harness.
author: Aman Jayesh
license: MIT
homepage: https://github.com/jupist/phone-autopilot
tags: [phone, android, automation, routines]
requires_hermes: ">=0.21.6"
requires_plugins:
  - id: phone-harness
    version_range: ">=0.1.0,<1"
python_dependencies:
  - "phone-harness>=0.3.3,<0.4"
provides_tools:
  - routine
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  ask_before_apps:
    type: bool
    default: false
    description: >-
      Ask before a routine or phone_exec uses an app that is not in allowed_apps. The script
      waits while the phone pane asks you to Allow it or choose Not now. Off: scripts may use
      any app. Either way, scripts stop at Android's own permission dialogs and leave them to you.
  allowed_apps:
    type: list
    default: []
    description: >-
      Apps you have allowed, as Android package names (e.g. com.spotify.music). Used when
      ask_before_apps is on.
