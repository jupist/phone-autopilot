name: phone-autopilot
version: 0.1.0
manifest_version: 2
description: Teach your phone a task once, replay it without the model, heal it when an app changes, and schedule it daily. Builds on phone-harness.
author: Aman Jayesh
license: MIT
homepage: https://github.com/jupist/phone-autopilot
tags: [phone, android, automation, routines]
requires_hermes: ">=0.21.6"
requires_plugins:
  - id: phone-harness
    version_range: ">=0.1.0,<1"
python_dependencies:
  - "phone-harness>=0.3.3,<0.4"
provides_tools:
  - routine
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  allowed_apps:
    type: list
    default: []
    description: >-
      Android package names routines and phone_exec may use, e.g. com.spotify.music.
      The first time a script reaches any other app, it pauses and the phone pane asks you
      to Allow it or choose Not now. Launchers and system dialogs never ask.
  allow_all_apps:
    type: bool
    default: false
    description: >-
      Let routines and phone_exec use any app without asking.
