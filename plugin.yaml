name: pocket-autopilot
version: 0.1.0
manifest_version: 2
description: Teach your phone a task once, replay it without the model, heal it when an app changes, and schedule it daily. Builds on phone-harness.
author: Aman Jayesh
license: MIT
tags: [phone, android, iphone, automation, routines]
requires_hermes: ">=0.21.6"
requires_plugins:
  - id: phone-harness
python_dependencies:
  - "phone-harness==0.3.3"
provides_tools:
  - routine
provides_hooks:
  - pre_tool_call
config_schema:
  allowed_apps:
    type: list
    default: []
    description: >-
      Android package names the agent and routines may open, e.g. com.tpcstld.twozerogame.
      When set, a watchdog sends the phone Home and stops the script within about a second
      of any other app coming to the front (launchers and system dialogs are always allowed).
      Empty means no restriction.
