name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22"
      - name: Python tests (dependencies at least 7 days old)
        run: |
          uv run --exclude-newer "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" --no-project --python 3.12 \
            --with pytest --with fastapi --with httpx --with pillow \
            python -m pytest tests -q
      - name: Desktop smoke test
        run: node --no-warnings tests/js/run_check.mjs
